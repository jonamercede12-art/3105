name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Buscar proyecto Xcode
        shell: bash
        run: |
          set -e

          echo "Buscando proyecto Xcode..."

          PROJECT=$(find . -type d -name "*.xcodeproj" -print -quit)

          if [ -z "$PROJECT" ]; then
            echo "ERROR: No se encontró ningún archivo .xcodeproj"
            echo "Contenido del repositorio:"
            find . -maxdepth 5 -type f | head -200
            exit 1
          fi

          echo "Proyecto encontrado:"
          echo "$PROJECT"

          echo "Mostrando schemes:"
          xcodebuild -list -project "$PROJECT"

      - name: Compilar aplicación
        shell: bash
        run: |
          set -e

          PROJECT=$(find . -type d -name "*.xcodeproj" -print -quit)

          SCHEME=$(xcodebuild -list -project "$PROJECT" 2>/dev/null | \
            awk '/Schemes:/{found=1; next} found && NF {print; exit}' | xargs)

          if [ -z "$SCHEME" ]; then
            echo "ERROR: No se encontró ningún Scheme"
            exit 1
          fi

          echo "Scheme encontrado: $SCHEME"

          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Encontrar aplicación
        shell: bash
        run: |
          set -e

          APP=$(find build -type d -name "*.app" -print -quit)

          if [ -z "$APP" ]; then
            echo "ERROR: No se encontró ninguna aplicación .app"
            exit 1
          fi

          echo "Aplicación encontrada:"
          echo "$APP"

          mkdir -p Payload
          cp -R "$APP" Payload/

      - name: Crear IPA
        shell: bash
        run: |
          set -e

          zip -r ThreeOneOSFive.ipa Payload

          echo "IPA creada:"
          ls -lh ThreeOneOSFive.ipa

      - name: Subir IPA
        uses: actions/upload-artifact@v4
        with:
          name: ThreeOneOSFive-IPA
          path: ThreeOneOSFive.ipa
