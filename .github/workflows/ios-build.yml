name: Build iOS

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Set up job
        uses: actions/checkout@v4

      - name: Show files
        run: |
          echo "Contenido del repositorio:"
          find . -maxdepth 5 -type f | sort

      - name: Find IPA
        id: find_ipa
        shell: bash
        run: |
          set -euo pipefail

          IPA=$(find . -type f -name "*.ipa" | head -n 1 || true)

          if [ -z "$IPA" ]; then
            echo "ERROR: No se encontró ningún archivo .ipa"
            echo "Archivos encontrados:"
            find . -type f | sort
            exit 1
          fi

          echo "IPA encontrado: $IPA"
          echo "ipa=$IPA" >> "$GITHUB_OUTPUT"

      - name: Verify IPA
        run: |
          set -euo pipefail

          IPA="${{ steps.find_ipa.outputs.ipa }}"

          echo "Verificando IPA:"
          echo "$IPA"

          unzip -l "$IPA" | head -50

          if ! unzip -l "$IPA" | grep -q "Payload/"; then
            echo "ERROR: El IPA no contiene Payload/"
            exit 1
          fi

          echo "IPA válido."

      - name: Extract IPA
        run: |
          set -euo pipefail

          rm -rf extracted
          mkdir extracted

          unzip -q "${{ steps.find_ipa.outputs.ipa }}" -d extracted

          echo "Contenido extraído:"
          find extracted -maxdepth 4 -type f | sort

      - name: Check application
        run: |
          set -euo pipefail

          APP=$(find extracted/Payload -maxdepth 1 -type d -name "*.app" | head -n 1 || true)

          if [ -z "$APP" ]; then
            echo "ERROR: No se encontró ninguna aplicación .app"
            exit 1
          fi

          echo "Aplicación encontrada:"
          echo "$APP"

          if [ ! -f "$APP/Info.plist" ]; then
            echo "ERROR: La aplicación no contiene Info.plist"
            exit 1
          fi

          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP/Info.plist" || true
          /usr/libexec/PlistBuddy -c "Print :CFBundleDisplayName" "$APP/Info.plist" || true

      - name: Check license configuration
        run: |
          set -euo pipefail

          APP=$(find extracted/Payload -maxdepth 1 -type d -name "*.app" | head -n 1)

          echo "Comprobando configuración de licencia..."

          if /usr/libexec/PlistBuddy -c "Print :LicenseAPIBaseURL" "$APP/Info.plist" >/tmp/license_url 2>/dev/null; then
            echo "LicenseAPIBaseURL:"
            cat /tmp/license_url
          else
            echo "AVISO: LicenseAPIBaseURL no está presente."
          fi

          if /usr/libexec/PlistBuddy -c "Print :LicenseAPIAnonKey" "$APP/Info.plist" >/tmp/license_key 2>/dev/null; then
            echo "LicenseAPIAnonKey configurada."
          else
            echo "AVISO: LicenseAPIAnonKey no está presente."
          fi

      - name: Package IPA
        run: |
          set -euo pipefail

          mkdir -p output

          cp "${{ steps.find_ipa.outputs.ipa }}" \
             "output/3105-unsigned.ipa"

          echo "IPA preparado:"
          ls -lh output/3105-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: 3105-ios-build
          path: output/3105-unsigned.ipa
          if-no-files-found: error
