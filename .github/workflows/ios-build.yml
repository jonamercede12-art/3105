name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Buscar proyecto
        run: |
          echo "=== Proyectos Xcode ==="
          find . -name "*.xcodeproj" -o -name "*.xcworkspace"

      - name: Mostrar schemes
        run: |
          cd source/3105-main
          xcodebuild -list -project ThreeOneOSFive.xcodeproj

      - name: Compilar aplicación
        run: |
          cd source/3105-main

          xcodebuild \
            -project ThreeOneOSFive.xcodeproj \
            -scheme ThreeOneOSFive \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Encontrar aplicación
        run: |
          echo "=== Apps encontradas ==="
          find source/3105-main/build -name "*.app" -type d

      - name: Crear IPA
        run: |
          APP=$(find source/3105-main/build -name "*.app" -type d | head -n 1)

          if [ -z "$APP" ]; then
            echo "ERROR: No se encontró ningún .app"
            exit 1
          fi

          rm -rf Payload
          mkdir Payload
          cp -R "$APP" Payload/

          mkdir -p artifacts
          zip -r artifacts/ThreeOneOSFive.ipa Payload

      - name: Subir IPA
        uses: actions/upload-artifact@v4
        with:
          name: ThreeOneOSFive-IPA
          path: artifacts/ThreeOneOSFive.ipa
