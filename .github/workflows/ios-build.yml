- name: Mostrar schemes
  shell: bash
  run: |
    set -e
    echo "Contenido del workspace:"
    find . -maxdepth 4 -type d -name "*.xcodeproj" -print
    find . -maxdepth 4 -type d -name "*.xcworkspace" -print

    PROJECT=$(find . -type d -name "*.xcodeproj" -print -quit)

    if [ -z "$PROJECT" ]; then
      echo "ERROR: No se encontró ningún proyecto Xcode (.xcodeproj)"
      exit 1
    fi

    echo "Proyecto encontrado: $PROJECT"

    xcodebuild -list -project "$PROJECT"
