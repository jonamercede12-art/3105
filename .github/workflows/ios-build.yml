name: Build iOS app

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Unpack iOS project
        run: |
          set -euo pipefail

          rm -rf source
          mkdir -p source

          test -f 3105-with-github-actions.zip

          unzip -q 3105-with-github-actions.zip -d source

          echo "=== Xcode projects found ==="
          find source -type d -name "*.xcodeproj" -print

      - name: Find Xcode project
        run: |
          set -euo pipefail

          PROJECT="$(find source -type d -name "*.xcodeproj" -print -quit)"

          if [ -z "$PROJECT" ]; then
            echo "ERROR: No se encontró ningún archivo .xcodeproj"
            echo "Contenido de source:"
            find source -maxdepth 5 -print
            exit 1
          fi

          echo "Proyecto encontrado:"
          echo "$PROJECT"

          echo "PROJECT=$PROJECT" >> "$GITHUB_ENV"

      - name: Show project information
        run: |
          echo "Usando proyecto: $PROJECT"
          xcodebuild -list -project "$PROJECT"

      - name: Build unsigned app
        run: |
          set -o pipefail

          xcodebuild \
            -project "$PROJECT" \
            -target 3105 \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CONFIGURATION_BUILD_DIR="$PWD/source/build/Build/Products/Release-iphoneos" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package unsigned IPA
        run: |
          set -euo pipefail

          APP_PATH="$(find source/build/Build/Products/Release-iphoneos \
            -maxdepth 1 \
            -type d \
            -name '*.app' \
            -print \
            -quit)"

          test -n "$APP_PATH"

          rm -rf Payload
          mkdir Payload

          cp -R "$APP_PATH" Payload/

          /usr/bin/zip -qry 3105-unsigned.ipa Payload

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: 3105-ios-build
          path: |
            3105-unsigned.ipa
            source/build/Build/Products/Release-iphoneos/*.app
          if-no-files-found: error
